name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:all
      - name: Package
        run: |
          cp dist-single/AI-Content-Reviewer.html .
          (cd dist && zip -r ../AI-Content-Reviewer-web.zip .)
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            AI-Content-Reviewer.html
            AI-Content-Reviewer-web.zip
